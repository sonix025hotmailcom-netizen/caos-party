  const ms = m.getWorldScale(new T.Vector3()).x, hold = new T.Group(); hold.name = 'acc_p';
  hold.position.set(1.85, 4.3, -.3); m.add(hold);
  const spin = new T.Group(); hold.add(spin);
  if (it.glb) {
    C3D.load('assets/td/' + it.glb + '.glb').then(g => { const o = g.scene.clone(true), b = new T.Box3().setFromObject(o), sz = Math.max(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z) || 1; o.scale.setScalar((id === 'crystal' ? 1 : 1.6) / sz); o.position.y = -(b.min.y + b.max.y) / 2 * o.scale.x; o.traverse(q => { if (q.isMesh) { q.castShadow = true; q.frustumCulled = false; } }); spin.add(o); }).catch(() => {});
    const ph = Math.random() * 6; const dummy = new T.Mesh(new T.SphereGeometry(.01), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); hold.add(dummy);
    dummy.onBeforeRender = () => { const t = performance.now() / 1000; hold.position.y = 4.3 + Math.sin(t * 2 + ph) * .2; spin.rotation.y = t * (id === 'crystal' ? 1.5 : .9); };

const PPT = [['closed', '✊', 'Piedra'], ['open', '✋', 'Papel'], ['peace', '✌️', 'Tijera']];
Object.assign(GAMES, {
  ppt: {
    name: 'Piedra, Papel o Tijera', emoji: '✌️', color: '#7c3aed', N: 7,
    desc: '¡Todos contra todos! Elegí piedra ✊, papel ✋ o tijera ✌️ en tu cel. Ganás 1 punto por cada jugador al que le ganás. Pero ojo: hay rondas AL REVÉS 🙃 donde gana lo que normalmente pierde.',
    start() {
      const ids = onlineIds(); ['red', 'blue', 'green', 'pink', 'purple', 'yellow'].forEach(c => PPT.forEach(([g]) => IMG('shapes/' + handImg(c, g))));
      H.gd = { ids, r: 0, pts: Object.fromEntries(ids.map(i => [i, 0])), wins: Object.fromEntries(ids.map(i => [i, 0])) };
      setTimeout(() => this.round(), 300);
    },
    round() {
      const gd = H.gd; gd.r++; gd.pick = {}; gd.rev = gd.r > 2 && Math.random() < .3;
      setPhase('pp-go', 7000, () => GAMES.ppt.reveal());
      SND.play(gd.rev ? 'ui_question_001' : 'ui_bong_001', .5);
    },
    beats(a, b, rev) { const w = (a === 0 && b === 2) || (a === 1 && b === 0) || (a === 2 && b === 1); return a === b ? 0 : (rev ? !w : w) ? 1 : -1; },
    onAct(p, m) {
      const gd = H.gd; if (H.phase !== 'pp-go' || m.a !== 'ppt' || !inGame(p) || gd.pick[p.id] != null) return;
      const c = m.c | 0; if (c < 0 || c > 2) return; gd.pick[p.id] = c; SFX.pop(); updateStrip(); sync();
      checkAll(id => gd.pick[id] != null, () => GAMES.ppt.reveal());
    },
    isDone(id) { return H.phase === 'pp-go' && H.gd.pick?.[id] != null; },
    reveal() {
      const gd = H.gd; if (H.phase !== 'pp-go') return;
      gd.ids.forEach(id => { if (gd.pick[id] == null) gd.pick[id] = -1; });
      gd.delta = {};
      for (const a of gd.ids) { let d = 0; if (gd.pick[a] >= 0) for (const b of gd.ids) if (a !== b && gd.pick[b] >= 0 && this.beats(gd.pick[a], gd.pick[b], gd.rev) > 0) d++; gd.delta[a] = d; gd.pts[a] += d; }
      const best = Math.max(...gd.ids.map(id => gd.delta[id])); if (best > 0) gd.ids.forEach(id => { if (gd.delta[id] === best) gd.wins[id]++; });
      SND.play('impactPunch_medium_000', .6);
      setPhase('pp-rev', 3800, () => { if (gd.r >= this.N) this.end(); else this.round(); }, 0, false);
    },
    end() {
      const gd = H.gd, g = rankGains(gd.ids, id => gd.pts[id], true);
      gd.rows = gd.ids.slice().sort((a, b) => gd.pts[b] - gd.pts[a]).map(id => ({ id, val: `⭐ ${gd.pts[id]} puntos · 🏅 ${gd.wins[id]} rondas`, gain: g[id] || 0 }));
      setPhase('pp-res', 5500, () => finishGame(g), 0, false); confetti(90); SFX.win();
    },
    view(p) {
      const gd = H.gd;
      if (!inGame(p)) return watch('Entrás en el próximo juego 😉');
      if (H.phase === 'pp-go') return { screen: 'ppt', key: `pp${gd.r}-${gd.pick[p.id] ?? 'x'}`, r: gd.r, N: this.N, rev: gd.rev, picked: gd.pick[p.id] ?? -1, deadline: H.deadline };
      if (H.phase === 'pp-rev') { const d = gd.delta[p.id] || 0, pk = gd.pick[p.id]; return { screen: 'msg', big: pk >= 0 ? PPT[pk][1] : '😴', title: pk < 0 ? 'No elegiste' : d > 0 ? `¡Le ganaste a ${d}!` : 'No le ganaste a nadie', text: `Tenés ${gd.pts[p.id]} puntos` }; }
      return watch();
    },
    render(ph) {
      const gd = H.gd;
      if (ph === 'pp-res') return `<h1 class="title-pop">✌️ Los campeones del piedra, papel o tijera</h1>${resultsList(gd.rows)}`;
      const cols = ['red', 'blue', 'green', 'pink', 'purple', 'yellow'];
      if (ph === 'pp-rev') {
        const count = [0, 1, 2].map(c => gd.ids.filter(id => gd.pick[id] === c).length);
        setTimeout(() => { if (window.gsap) { gsap.from('.ppcard', { y: 60, rotation: () => -20 + Math.random() * 40, opacity: 0, stagger: .06, duration: .45, ease: 'back.out(2)' }); } }, 20);
        return `<div class="round-lbl">Ronda ${gd.r} de ${this.N}${gd.rev ? ' · 🙃 AL REVÉS' : ''}</div>
          <div class="ppsum">${PPT.map(([g, e, n], c) => `<span>${e} ${n}: <b>${count[c]}</b></span>`).join('')}</div>
          <div class="ppgrid">${gd.ids.slice().sort((a, b) => gd.delta[b] - gd.delta[a]).map((id, k) => { const p = pl(id), c = gd.pick[id]; return `<div class="ppcard ${gd.delta[id] > 0 && gd.delta[id] === gd.delta[gd.ids.slice().sort((a, b) => gd.delta[b] - gd.delta[a])[0]] ? 'win' : ''}" style="--c:${p?.color}">${c >= 0 ? `<img src="assets/shapes/${handImg(cols[k % 6], PPT[c][0])}" alt="${PPT[c][1]}">` : '<div class="ppz">😴</div>'}<b>${p?.emoji} ${esc(p?.name || '')}</b><span>+${gd.delta[id]}</span></div>`; }).join('')}</div>`;
      }
      setTimeout(() => { if (window.gsap) gsap.fromTo('.ppbig img', { rotation: -25, y: 0 }, { rotation: 15, y: -20, yoyo: true, repeat: -1, duration: .35, stagger: .1, ease: 'sine.inOut' }); }, 20);
      return `<div class="round-lbl">Ronda ${gd.r} de ${this.N}</div>
        ${gd.rev ? '<div class="pprev">🙃 ¡RONDA AL REVÉS! Gana lo que normalmente pierde</div>' : ''}
        <div class="ppbig">${PPT.map(([g], c) => `<img src="assets/shapes/${handImg(cols[(c * 2 + gd.r) % 6], g)}" alt="">`).join('')}</div>
        <h2 class="title-pop">¡Piedra, papel o tijera!</h2><p class="sub">Elegí en tu cel · 1 punto por cada jugador al que le ganés</p>`;

      const crown = new T.Group(); const gm = M('#facc15', { metalness: .8, roughness: .25, emissive: '#b45309', emissiveIntensity: .25 }); const band = new T.Mesh(new T.CylinderGeometry(.5, .45, .35, 20, 1, true), gm); band.material.side = T.DoubleSide; crown.add(band); for (let q = 0; q < 5; q++) { const sp = new T.Mesh(new T.ConeGeometry(.12, .38, 8), gm); const a = q / 5 * 6.28; sp.position.set(Math.sin(a) * .47, .34, Math.cos(a) * .47); crown.add(sp); const gem = new T.Mesh(new T.SphereGeometry(.07, 8, 6), M(['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#f43f5e'][q], { emissive: '#ffffff', emissiveIntensity: .2 })); gem.position.set(Math.sin(a) * .5, 0, Math.cos(a) * .5); crown.add(gem); }
      crown.position.y = 3; zone.add(crown); r.crown = crown;
      r.ghost = add(new T.Mesh(new T.TorusGeometry(G.ZR, .07, 8, 48), new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .0 }))); r.ghost.rotation.x = Math.PI / 2; r.ghost.position.y = .05;
      CARX.sparks(T, r, 120); r.bots = {};
      gd.ids.forEach(id => C3D.load(charURL(charOf(pl(id)))).then(g => { if (H.gd !== gd) return; const a = C3D.make(g, hFor(g, 1.5), tintFor(g, id)); a.play('Idle'); const hold = new T.Group(); hold.add(a.obj); add(hold); const lb = GAMES.ovni.label(T, `${pl(id)?.emoji || ''} ${pl(id)?.name || ''}`, pl(id)?.color || '#fff'); lb.position.y = 2.3; lb.scale.set(2.6, .65, 1); lb.material.depthTest = false; lb.renderOrder = 10; hold.add(lb); const sh = new T.Mesh(new T.CircleGeometry(.45, 20), new T.MeshBasicMaterial({ color: '#000', transparent: true, opacity: .28, depthWrite: false })); sh.rotation.x = -Math.PI / 2; add(sh); a.hold = hold; a.sh = sh; r.bots[id] = a; }).catch(() => {}));
      return r;
    },
    draw(ctx) {
      const G = GAMES.crown, gd = H.gd, r = gd.r3;
      if (r && r.renderer.domElement.isConnected) {
        const now = performance.now(), dt = Math.min(.05, (now - (r.last || now)) / 1000); r.last = now; const tt = now / 1000;
        r.zone.position.x += (gd.zx - r.zone.position.x) * Math.min(1, dt * 5); r.zone.position.z += (gd.zz - r.zone.position.z) * Math.min(1, dt * 5);
        const contested = gd.crowd > 1; r.disk.material.color.set(gd.king ? '#fde047' : contested ? '#f87171' : '#fef9c3'); r.disk.material.opacity = .28 + Math.sin(tt * 4) * .08; r.ring.material.emissiveIntensity = .6 + Math.sin(tt * 6) * .4;
        const K = gd.king && r.bots[gd.king]; if (K) { r.crown.position.lerp(new r.T.Vector3(K.hold.position.x - r.zone.position.x, K.hold.position.y + 2.95, K.hold.position.z - r.zone.position.z), Math.min(1, dt * 10)); } else r.crown.position.lerp(new r.T.Vector3(0, 2.6 + Math.sin(tt * 2) * .25, 0), Math.min(1, dt * 4));
        r.crown.rotation.y += dt * 2;
        r.ghost.material.opacity = gd.warn ? .5 + Math.sin(tt * 12) * .4 : 0; r.ghost.position.x = gd.nx; r.ghost.position.z = gd.nz;
        (r.flags || []).forEach((f, k) => f.rotation.y = Math.sin(tt * 3 + k) * .4);
        for (const id of gd.ids) {
          const a = r.bots[id], s = gd.ps[id]; if (!a) continue; a.hold.position.set(s.x, s.y, s.z); a.hold.visible = s.y > -12; a.obj.rotation.y = s.face;
          const sp = Math.hypot(s.vx, s.vz); a.play(s.dead > 0 ? 'Jump' : s.hit > 0 ? 'No' : s.dash > 0 ? 'Punch' : s.y > .05 ? 'Jump' : sp > .8 ? 'Running' : gd.king === id ? 'Dance' : 'Idle'); a.mixer.update(dt);
          a.sh.visible = s.dead <= 0 && Math.hypot(s.x, s.z) <= G.R; a.sh.position.set(s.x, .03, s.z);
        }

        r.cam.position.set(0, 13.4, 11.8); r.cam.lookAt(0, -.4, .7); r.renderer.render(r.scene, r.cam);
        const srt = gd.ids.slice().sort((a, b) => gd.ps[b].pts - gd.ps[a].pts), msgs = gd.msgs.filter(m => gd.t - m.k < 2.6).slice(-3);
        CARX.overlay(r, `<div class="cxtop">${srt.map((id, k) => { const p = pl(id); return `<span class="cxpill${gd.ps[id].dead > 0 ? ' off' : ''}" style="--c:${p?.color || '#888'}">${gd.king === id ? '👑 ' : ''}${p?.emoji || ''} ${esc(p?.name || '')} ${gd.ps[id].pts.toFixed(0)}</span>`; }).join('')}</div>${H.phase === 'cr-go' && gd.crowd > 1 ? '<div class="cxbig" style="top:84%;font-size:1.5em">⚔️ ¡Zona en disputa! Suman muy poquito</div>' : ''}<div class="cxmsgs">${msgs.map(m => `<div class="cxmsg">${m.t}</div>`).join('')}</div>`);

      for (const id of gd.ids) { const s = gd.ps[id]; if (s.dead > 0) continue; emo(ctx, pl(id)?.emoji || '?', 500 + s.x * S, 300 + s.z * S, 30); }
    }

});
GAME_TAGS.crown = ['miniatures', 'interaction'];
(() => {
  const ob = botBrain;
  botBrain = function (p) {
    const gd = H.gd, G = GAMES.crown;
    if (H.game === G && gd.ps && (H.phase === 'cr-go' || H.phase === 'cr-ready')) {
      const s = gd.ps[p.id]; if (!s) return; if (H.phase === 'cr-ready' || s.dead > 0) return joyAct(p, { a: 'joy', x: 0, y: 0, b: s.lb });
      const M = p._cr || (p._cr = { b: 0, skill: .5 + Math.random() * .5, ox: (Math.random() - .5) * 1.6, oz: (Math.random() - .5) * 1.6, wait: 0 }); M.wait -= .22; if (M.wait <= 0 && gd.crowd > 2 && Math.random() < .08) M.wait = 2 + Math.random() * 3;
      let tx = gd.zx + M.ox * (M.wait > 0 ? 2.6 : .6), tz = gd.zz + M.oz * (M.wait > 0 ? 2.6 : .6); if (Math.hypot(s.x, s.z) > G.R - 1) { tx = 0; tz = 0; }
      let x = tx - s.x, y = tz - s.z; const d = Math.hypot(x, y); if (d < .35) { x = 0; y = 0; } else { x /= d; y /= d; }
      const foe = gd.ids.map(i => gd.ps[i]).find(o => o !== s && o.dead <= 0 && Math.hypot(o.x - s.x, o.z - s.z) < 1.6 && Math.hypot(o.x - gd.zx, o.z - gd.zz) < G.ZR + .5);
      if (foe && s.cd <= 0 && Math.random() < .35 * M.skill) { const fx = foe.x - s.x, fz = foe.z - s.z, fd = Math.hypot(fx, fz) || 1; x = fx / fd; y = fz / fd; M.b++; }
      return joyAct(p, { a: 'joy', x, y, b: M.b });
    }
    return ob(p);
  };
})();

/* ---------- escala automática de la interfaz ---------- */
function fitUI() {
  const w = innerWidth, h = innerHeight, land = w > h, ctrl = !!document.querySelector('#app > .ctrl');
  // los controles del cel no se escalan (sus joysticks/lienzos usan coordenadas de pantalla)
  let z = ctrl ? 1 : (land ? Math.min(w / 1280, h / 800) : (w < 700 ? 1 : Math.min(w / 620, h / 1000)));
  z = ctrl ? 1 : Math.max(.55, Math.min(2.2, z));
  const v = z.toFixed(3); if (document.documentElement.style.getPropertyValue('--z') !== v) document.documentElement.style.setProperty('--z', v);
}
addEventListener('resize', fitUI); addEventListener('orientationchange', () => setTimeout(fitUI, 200));
new MutationObserver(fitUI).observe(app, { childList: true });
fitUI();

boot();
